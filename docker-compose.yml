# Local development dependencies. Start with: docker compose up -d
# Brings up DynamoDB Local on :8000 (matches appsettings.Development.json).
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: who-pays-now-dynamodb
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"
